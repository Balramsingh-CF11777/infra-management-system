# Option A (recommended): React server proxies Frappe.
# The browser only talks to ims.company.com, so the Frappe sid cookie is first-party
# and no CORS is needed. config.js keeps frappeUrl: "".

upstream frappe_backend {
    server frappe.internal.company.com:443;   # Frappe/bench Nginx on the other server
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name ims.company.com;

    ssl_certificate     /etc/ssl/ims/fullchain.pem;
    ssl_certificate_key /etc/ssl/ims/privkey.pem;

    root /var/www/ims/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(api|files|private)/ {
        proxy_pass https://frappe_backend;
        proxy_ssl_server_name on;
        proxy_set_header Host frappe.internal.company.com;   # must match the Frappe site name
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        client_max_body_size 25m;
        proxy_cookie_flags sid secure httponly samesite=lax;
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
