# Option B: React server only serves static files. The browser calls Frappe directly.
# Requires:
#   - config.js: frappeUrl: "https://ims-api.company.com"
#   - Frappe site_config.json allow_cors (see deploy/FRAPPE_SITE_CONFIG.md)
#   - Both hosts under the same registrable domain (e.g. *.company.com).
#     Frappe's sid cookie is SameSite=Lax, so it is not sent cross-site.

server {
    listen 443 ssl http2;
    server_name ims.company.com;

    ssl_certificate     /etc/ssl/ims/fullchain.pem;
    ssl_certificate_key /etc/ssl/ims/privkey.pem;

    root /var/www/ims/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
